# detekt ruleset, shared with the sibling plugins AppleScript-JetBrains and ayu-jetbrains.
# Source-only configuration: no type-resolution classpath, because detekt 1.23.x bundles an
# older Kotlin compiler than the project uses. buildUponDefaultConfig=true in build.gradle.kts
# layers these overrides on top of detekt's bundled defaults.
style:
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    max: 10
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3

complexity:
  LongParameterList:
    constructorThreshold: 9
  LargeClass:
    excludes:
      - "**/test/**"
  LongMethod:
    threshold: 200
  TooManyFunctions:
    thresholdInClasses: 25
    thresholdInObjects: 20
  CyclomaticComplexMethod:
    threshold: 15
  NestedBlockDepth:
    threshold: 5

exceptions:
  TooGenericExceptionCaught:
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - IndexOutOfBoundsException
      - NullPointerException
      - Throwable
