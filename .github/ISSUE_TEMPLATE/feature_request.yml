name: Feature Request
description: Suggest a language, code insight, formatting, validation or IDE integration improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Puppet Tools? Please describe the workflow it improves.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Parser / grammar support
        - Syntax highlighting
        - Code completion / quick documentation
        - Navigation / find usages / rename
        - Formatting
        - Inspections / quick fixes
        - External validation (puppet parser validate, puppet-lint)
        - Hiera / template / file navigation
        - Live templates
        - Documentation / Marketplace listing
        - Build / CI / verifier
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would this improve your Puppet or OpenVox workflow?
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: Example manifest or template
      description: If relevant, include a `.pp` or `.epp` snippet that shows the construct.
      render: puppet
    validations:
      required: false
