name: Bug Report
description: Report a parsing, completion, navigation, formatting, inspection, validation or IDE integration issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue in a JetBrains IDE.
        Do not include secrets, tokens, or private data in public issues.
        Report security issues privately through GitHub Security Advisories.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parser / syntax errors
        - Syntax highlighting
        - Code completion / quick documentation
        - Navigation / find usages / rename
        - Formatting
        - Inspections / quick fixes
        - External validation (puppet parser validate, puppet-lint)
        - Hiera / template / file navigation
        - Live templates
        - Plugin installation / compatibility
        - Other
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE and version
      placeholder: "e.g. IntelliJ IDEA 2025.2.3 Community"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "e.g. 0.3.0"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Puppet or OpenVox version
      placeholder: "e.g. OpenVox 8.19.2, Puppet 8.10.0, none installed"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.5, Windows 11, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: Minimal manifest or template sample
      description: Paste the smallest `.pp` or `.epp` snippet that reproduces the issue.
      render: puppet
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Paste relevant errors from Help > Show Log in Finder/Explorer (`idea.log`)."
      render: text
    validations:
      required: false
