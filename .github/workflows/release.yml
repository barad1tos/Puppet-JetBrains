name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, never cancelled: a cancelled run could leave a tag half-released.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        shell: bash
        run: |
          release_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (${release_commit}) is not on origin/main"
            exit 1
          fi

      - name: Verify tag matches pluginVersion
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          plugin_version="$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '[:space:]')"
          if [[ "v${plugin_version}" != "$TAG_NAME" ]]; then
            echo "::error::Tag ${TAG_NAME} does not match pluginVersion ${plugin_version} in gradle.properties"
            exit 1
          fi

      - name: Verify tag is newer than the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          latest="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "$latest" ]]; then
            echo "No published release yet; ${TAG_NAME} is the first."
            exit 0
          fi
          if [[ "$latest" == "$TAG_NAME" ]]; then
            echo "::notice::A release for ${TAG_NAME} already exists; this rerun updates it."
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "${latest#v}" "${TAG_NAME#v}" | sort -V | tail -n1)"
          if [[ "$newest" != "${TAG_NAME#v}" ]]; then
            echo "::error::Tag ${TAG_NAME} is not newer than the latest release ${latest}"
            exit 1
          fi

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-disabled: true

      - name: Run language-data generator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build plugin
        run: ./gradlew build --stacktrace

      - name: Collect coverage
        run: ./gradlew koverXmlReport --stacktrace

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure --stacktrace

      - name: Verify plugin against recommended IDEs
        run: ./gradlew verifyPlugin --stacktrace

      - name: Verify docs metadata
        run: python3 scripts/verify-docs.py

      - name: Verify release helper scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Fail on internal API findings
        run: python3 scripts/verify-plugin-verifier.py

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-disabled: true

      - name: Resolve release secrets
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "PUBLISH_PLUGIN=false" >> "$GITHUB_ENV"
            echo "::notice::JETBRAINS_MARKETPLACE_TOKEN is not configured; the ZIP is attached to the GitHub Release only."
          else
            echo "PUBLISH_PLUGIN=true" >> "$GITHUB_ENV"
          fi

          signing_secrets=0
          [[ -n "$CERTIFICATE_CHAIN" ]] && (( signing_secrets += 1 ))
          [[ -n "$PRIVATE_KEY" ]] && (( signing_secrets += 1 ))
          [[ -n "$PRIVATE_KEY_PASSWORD" ]] && (( signing_secrets += 1 ))

          if (( signing_secrets == 0 )); then
            echo "SIGN_PLUGIN=false" >> "$GITHUB_ENV"
            echo "::notice::Signing secrets are not configured; the plugin artifact is unsigned."
          elif (( signing_secrets != 3 )); then
            echo "::error::Signing secrets must be configured all together: CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD"
            exit 1
          else
            echo "SIGN_PLUGIN=true" >> "$GITHUB_ENV"
          fi

      - name: Build and optionally sign
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          tasks=(buildPlugin)
          [[ "$SIGN_PLUGIN" == "true" ]] && tasks+=(signPlugin)
          ./gradlew "${tasks[@]}" --stacktrace

      - name: Select release asset
        shell: bash
        run: |
          shopt -s nullglob
          signed=(build/distributions/*-signed.zip)
          plain=(build/distributions/*.zip)
          asset="${signed[0]:-${plain[0]:-}}"
          if [[ -z "$asset" ]]; then
            echo "::error::No plugin ZIP found in build/distributions"
            exit 1
          fi
          echo "RELEASE_ASSET=$asset" >> "$GITHUB_ENV"

      # The GitHub Release comes first and is idempotent (a rerun updates the existing release), so a
      # Marketplace failure never leaves a published version without its ZIP. A rerun repeats
      # publishPlugin; Marketplace rejects a version it already holds, so the worst case is a red
      # rerun, never a duplicate or a missing asset.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: ${{ env.RELEASE_ASSET }}
          generate_release_notes: true
          draft: false

      - name: Publish to JetBrains Marketplace
        if: env.PUBLISH_PLUGIN == 'true'
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --stacktrace
